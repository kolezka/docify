- insert:
    - id: claude-compat-docify
      name: '@kolezka/docify-dsh'
# claude-plugin-dsh does not read MCP config; connect to the existing Docify service.
# Set DOCIFY_MCP_TOKEN in the DSH process environment and optionally DOCIFY_MCP_URL.
- insert:
    - id: claude-compat-docify-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: docify
        transport: streamable-http
        url: !!js 'process.env.DOCIFY_MCP_URL || "http://127.0.0.1:4747/mcp"'
        headers:
          Authorization: !!js '`Bearer ${process.env.DOCIFY_MCP_TOKEN || ""}`'
        failOnStartupError: false
